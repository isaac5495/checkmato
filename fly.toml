app = "checkmato"
primary_region = "sin"   # change to your nearest region

[build]

[env]
  PORT = "8000"
  CHECKMATO_CORS_ORIGINS = "https://checkmato-app.vercel.app,https://out-cyan-eight.vercel.app,https://out-check-mato.vercel.app,https://checkmato.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "checkmato_data"
  destination = "/tmp/checkmato_jobs"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/api/health"
    timeout = "5s"
